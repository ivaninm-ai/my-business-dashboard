name: Tests (instructor / maintainers)
# Runs the simulated test-suite. Students do not need this; it runs automatically on
# pushes to the template and on pull requests.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
